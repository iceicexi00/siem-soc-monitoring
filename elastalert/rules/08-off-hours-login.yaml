name: Off-hours successful login
type: any
index: rsb-siem-*

filter:
  - query:
      query_string:
        query: 'event.module:"system" AND event.category:"authentication" AND event.outcome:"success" AND NOT user.name:("root" OR "ubuntu" OR "systemd*")'
  - script:
      script:
        source: |
          ZonedDateTime t = doc['@timestamp'].value.withZoneSameInstant(ZoneId.of('Europe/Moscow'));
          int h = t.getHour();
          int d = t.getDayOfWeek().getValue();
          return (h < 7 || h > 21 || d > 5);

realert:
  minutes: 30

alert:
  - post

http_post_url: "http://10.10.0.12:5001/alert"
