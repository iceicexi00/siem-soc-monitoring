filter {
  # ============ LINUX AUTH LOG (SSH, sudo) ============
  if [event][module] == "system" and [fileset][name] == "auth" {
    grok {
      match => {
        "message" => [
          "Failed password for (invalid user )?%{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER:[source][port]}",
          "Accepted password for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER:[source][port]}",
          "Accepted publickey for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER:[source][port]}",
          "session opened for user %{USERNAME:[user][name]}",
          "sudo: %{USERNAME:[user][name]} : TTY=%{DATA:[user][terminal]} ; PWD=%{DATA:[user][cwd]} ; USER=%{USERNAME:[user][target]} ; COMMAND=%{GREEDYDATA:[process][command_line]}"
        ]
      }
      tag_on_failure => ["_grokparse_ssh"]
    }

    if "Failed password" in [message] {
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][outcome]" => "failure"
          "[event][type]" => "ssh_failed_login"
        }
      }
    } else if "Accepted" in [message] {
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][outcome]" => "success"
          "[event][type]" => "ssh_success_login"
        }
      }
    } else if "sudo:" in [message] {
      mutate {
        add_field => {
          "[event][category]" => "privilege_use"
          "[event][type]" => "sudo_command"
        }
      }
    }
  }

  # ============ AUDITD ============
  if [event][module] == "auditd" {
    if "identity" in [tags] or [auditd][summary][object][primary] in ["/etc/passwd", "/etc/shadow", "/etc/sudoers", "/etc/group"] {
      mutate {
        add_field => {
          "[event][category]" => "iam"
          "[event][severity]" => "high"
        }
      }
    }
  }

  # ============ SYSMON FOR LINUX ============
  if [event][provider] == "Linux-Sysmon" or [process][executable] {
    if [process][command_line] {
      if [process][command_line] =~ /(?i)(curl|wget).*\|.*(bash|sh|python)/ {
        mutate {
          add_field => {
            "[event][category]" => "process_suspicious"
            "[event][severity]" => "high"
          }
          add_tag => ["download_and_exec"]
        }
      }
      if [process][command_line] =~ /(?i)(nc|netcat).* -e/ {
        mutate { add_tag => ["reverse_shell_candidate"] }
      }
      if [process][command_line] =~ /(?i)base64.*-d|echo.*\| base64/ {
        mutate { add_tag => ["base64_obfuscation"] }
      }
    }
  }

  # ============ ОБЩИЕ МЕТКИ ============
  mutate {
    add_field => {
      "[organization][name]" => "RSB"
      "[organization][env]" => "production-sim"
    }
  }
}
